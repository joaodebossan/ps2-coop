name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Instalar PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: Compilar
        run: python build.py
      - name: Dependências do AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
      - name: Gerar AppImage
        if: runner.os == 'Linux'
        run: bash tools/build_appimage.sh
      - name: Preparar executável Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/ps2coop.exe dist/PS2Coop.exe
      - name: Empacotar fonte
        run: python tools/package.py
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ps2coop-${{ matrix.os }}
          path: |
            dist/ps2coop
            dist/ps2coop.exe
            dist/PS2Coop.exe
            dist/PS2Coop-x86_64.AppImage
            dist/PS2Coop-Windows.zip
            dist/PS2Coop-Linux.tar.gz
          if-no-files-found: ignore
