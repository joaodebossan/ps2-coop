name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Instalar PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: Compilar binário
        run: python build.py
      - name: Dependências do AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
      - name: Gerar AppImage
        run: bash tools/build_appimage.sh
      - name: Salvar AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/PS2Coop-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Instalar PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: Compilar executável
        run: python build.py
      - name: Renomear para o release
        shell: pwsh
        run: Copy-Item dist/ps2coop.exe dist/PS2Coop.exe
      - name: Salvar executável
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/PS2Coop.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Listar arquivos do release
        run: ls -lh release-assets
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          name: PS2 Co-op ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            release-assets/PS2Coop.exe
            release-assets/PS2Coop-x86_64.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
